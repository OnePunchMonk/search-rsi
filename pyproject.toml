[project]
name = "search-rsi"
version = "0.2.0"
description = "Recursive self-improvement for search: learned query rewrites, evolved pipelines, cross-use-case transfer"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]
dense = ["sentence-transformers>=2.2"]

[project.scripts]
search-rsi = "search_rsi.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
